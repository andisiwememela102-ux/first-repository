{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="A simple sticky notes application">
    <title>{% block title %}Sticky Notes{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'notes/styles.css' %}">
</head>
<body>
    <header class="site-header">
        <div class="header-inner">
            <a class="brand" href="{% url 'note_list' %}">Sticky Notes</a>
            <a class="button button-light" href="{% url 'note_create' %}">+ New note</a>
        </div>
    </header>
    <main class="container">
        {% if messages %}
            <div class="messages" aria-live="polite">
                {% for message in messages %}
                    <p class="message">{{ message }}</p>
                {% endfor %}
            </div>
        {% endif %}
        {% block content %}{% endblock %}
    </main>
    <footer class="site-footer">A simple place to keep your thoughts.</footer>
</body>
</html>
